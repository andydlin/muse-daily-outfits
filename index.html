function end(e){points.delete(e.pointerId);gesture=null;if(points.size){let a=[...points.values()][0];start={x:a.x,y:a.y,tx:x,ty:y}}else{start=null;vp.classList.remove('drag')}}window.addEventListener('pointerup',end);window.addEventListener('pointercancel',end);vp.addEventListener('click',e=>{if(moved){e.stopImmediatePropagation();e.preventDefault()}},true);
vp.addEventListener('wheel',e=>{e.preventDefault();if(e.ctrlKey||e.metaKey)zoom(Math.exp(-e.deltaY*.01),e.clientX,e.clientY);else{x-=e.deltaX;y-=e.deltaY;draw()}},{passive:false});
function render(){let o=OUTFITS[current],s=state[current],a=asset(current);$('#large').src=a.file;$('#large').alt=a.alt;$('#title').textContent=o.theme;$('#date').textContent=o.dateLabel;$('#description').textContent=o.description;$('#outfit').textContent=o.outfit||'';$('#outfit').hidden=!o.outfit;$('#badge').textContent=s.side.toUpperCase()+' VIEW';$('#flip').textContent='↻ Flip to '+(s.side==='front'?'back':'front');$('#variant').hidden=!o.hairOff;$('#variant').textContent=acc(current)+' '+(s.on?'on':'off');$('#variant').setAttribute('aria-pressed',s.on);$('#save').href=a.file;$('#save').download=a.name;$('#position').textContent=`${String(OUTFITS.length-current).padStart(2,'0')} / ${OUTFITS.length} looks`;$('#prev').disabled=current===0;$('#next').disabled=current===OUTFITS.length-1;$('#live').textContent=o.theme+', '+s.side+' view';updateCard(current)}
function open(i){current=i;lastFocus=document.activeElement;modal.classList.remove('full');render();modal.showModal();syncVideos();$('#close').focus()}
function close(){modal.close();modal.classList.remove('full');if(lastFocus?.isConnected)lastFocus.focus();else (cards.get(current)?.querySelector('.photo')??document.body).focus();scheduleDraw()}
function next(d){if(current+d<0||current+d>=OUTFITS.length)return;current+=d;render()}
$('#close').onclick=()=>{if(modal.classList.contains('full'))modal.classList.remove('full');else close()};modal.addEventListener('click',e=>{if(e.target===modal)close()});$('#prev').onclick=()=>next(-1);$('#next').onclick=()=>next(1);$('#flip').onclick=()=>{state[current].side=state[current].side==='front'?'back':'front';render()};$('#variant').onclick=()=>{state[current].on=!state[current].on;render()};$('#save').innerHTML=icons.save;$('#expand').innerHTML=icons.expand;$('#expand').onclick=()=>modal.classList.toggle('full');$('#large').onclick=()=>modal.classList.toggle('full');
modal.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'){e.preventDefault();next(-1)}if(e.key==='ArrowRight'){e.preventDefault();next(1)}if(e.key.toLowerCase()==='f')$('#flip').click()});modal.addEventListener('cancel',e=>{e.preventDefault();if(modal.classList.contains('full'))modal.classList.remove('full');else close()});let swipe;$('#large').addEventListener('touchstart',e=>{swipe=e.touches.length===1?{x:e.touches[0].clientX,y:e.touches[0].clientY}:null},{passive:true});$('#large').addEventListener('touchend',e=>{if(!swipe)return;let dx=e.changedTouches[0].clientX-swipe.x,dy=e.changedTouches[0].clientY-swipe.y;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)){next(dx<0?1:-1);e.preventDefault()}swipe=null},{passive:false});
document.addEventListener('visibilitychange',syncVideos);motion.addEventListener('change',syncVideos);window.addEventListener('resize',reset);reset();
</script></body></html>
