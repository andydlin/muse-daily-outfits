const cards=new Map(),sceneChoices=new Map();

function syncVideos(){let candidates=[];for(let [i,c] of cards){let r=c.getBoundingClientRect();if(!document.hidden&&!modal.open&&!motion.matches&&state[i].side==='front'&&state[i].on&&r.width>=140&&r.right>0&&r.left<innerWidth&&r.bottom>0&&r.top<innerHeight)candidates.push([i,Math.hypot((r.left+r.right)/2-innerWidth/2,(r.top+r.bottom)/2-innerHeight/2)])}candidates.sort((a,b)=>a[1]-b[1]);let active=new Set(candidates.slice(0,4).map(a=>a[0]));for(let [i,c] of cards)if(active.has(i))armVideo(i);else stopVideo(c,true)}

function reconcile(){let buffer=180/scale,left=(-x)/scale-buffer,right=(innerWidth-x)/scale+buffer,top=(-y)/scale-buffer,bottom=(innerHeight-y)/scale+buffer;let wanted=new Set();let c0=Math.max(0,Math.floor(left/248)),c1=Math.min(cols-1,Math.floor(right/248)),r0=Math.max(0,Math.floor(top/rowHeight)),r1=Math.min(Math.ceil(OUTFITS.length/cols)-1,Math.floor(bottom/rowHeight));for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++){let i=r*cols+c;if(i<OUTFITS.length)wanted.add(i)}for(let [i,c] of cards)if(!wanted.has(i)&&!c.contains(document.activeElement)){stopVideo(c,true);c.remove();cards.delete(i)}for(let i of wanted){if(!cards.has(i))mountCard(i);let c=cards.get(i);c.style.position='absolute';c.style.left=(i%cols)*248+'px';c.style.top=Math.floor(i/cols)*rowHeight+'px'}syncVideos()}

const points=new Map();let start,gesture;

function render(){let o=OUTFITS[current],s=state[current],a=asset(current);$('#large').src=a.file;$('#large').alt=a.alt;$('#title').textContent=o.theme;$('#date').textContent=o.dateLabel;$('#description').textContent=o.description;$('#badge').textContent=s.side.toUpperCase()+' VIEW';$('#flip').textContent='↻ Flip to '+(s.side==='front'?'back':'front');$('#variant').hidden=!o.hairOff;$('#variant').textContent=acc(current)+' '+(s.on?'on':'off');$('#variant').setAttribute('aria-pressed',s.on);$('#save').href=a.file;$('#save').download=a.name;$('#position').textContent=`${String(current+1).padStart(2,'0')} / ${OUTFITS.length} looks`;$('#prev').disabled=current===0;$('#next').disabled=current===OUTFITS.length-1;$('#live').textContent=o.theme+', '+s.side+' view';updateCard(current)}
